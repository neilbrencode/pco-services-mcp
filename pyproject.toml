[project]
name = "pco-services-mcp"
version = "0.1.0"
description = "Local MCP server for a volunteer's own Planning Center Services schedule, blockouts, service orders and attachments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "planning-center", "pco", "church", "worship", "scheduling"]
dependencies = [
    "mcp[cli]>=2",
    "httpx>=0.27",
    # Credentials live in the OS credential store (Windows Credential Manager,
    # macOS Keychain, Secret Service), never in a file in this repository.
    "keyring>=25",
    # Windows ships no IANA time zone database, so zoneinfo needs this to
    # resolve the organization's time zone for all-day blockouts.
    "tzdata",
]

[project.scripts]
pco-services-mcp = "pco_services_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pco_services_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
]
